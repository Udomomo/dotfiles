[settings]
dotfiles.root = "~/dotfiles"
dotfiles.default_mode = "symlink"

[dotfiles]
"~/.config/mise/config.toml" = "~/dotfiles/mise/config.toml"
"~/.zshrc" = {}
"~/.gitconfig" = {}
"~/.tigrc" = {}
"~/.tmux.conf" = {}
"~/.config/wezterm/wezterm.lua" = "~/dotfiles/wezterm.lua"
"~/.config/karabiner" = "~/dotfiles/karabiner"
"~/.config/nvim" = "~/dotfiles/nvim"

[env]
GOPATH = "{{env.HOME}}"
_.path = [
  "/opt/homebrew/opt/curl/bin",
  "~/bin",
  "/opt/homebrew/bin",
  "/usr/local/sbin",
  "/usr/local/bin",  
]

[bootstrap.packages]
"brew:git" = "latest"
"brew:awscli" = "latest"
"brew:coreutils" = "latest"
"brew:gcc" = "latest"
"brew:tig" = "latest"
"brew:gh" = "latest"
"brew:ghq" = "latest"
"brew:fzf" = "latest"
"brew:findutils" = "latest"
"brew:grep" = "latest"
"brew:gnu-sed" = "latest"
"brew:gzip" = "latest"
"brew:tmux" = "latest"
"brew:neovim" = "latest"
"brew:jq" = "latest"
"brew:wget" = "latest"
"brew:go" = "latest"
"brew:curl" = "latest"
"brew:pre-commit" = "latest"
"brew:gradle" = "latest"
"brew-cask:1password" = "latest"
"brew-cask:google-chrome" = "latest"
"brew-cask:google-japanese-ime" = "latest"
"brew-cask:slack" = "latest"
"brew-cask:visual-studio-code" = "latest"
"brew-cask:sublime-text" = "latest"
"brew-cask:karabiner-elements" = "latest"
"brew-cask:zoom" = "latest"
"brew-cask:wezterm@nightly" = "latest"
"brew-cask:raycast" = "latest"
